name: Judgment OS CI

on:
  push:
    branches:
      - judgment-os/baton-field-v0
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Judgment OS tests
        run: npx vitest --environment jsdom --run tests/judgment/baton-field.spec.ts

      - name: Build
        run: npm run build-only

      - name: Donor test debt report
        if: always()
        run: |
          echo "Legacy donor suite is currently incompatible with Vitest 4 mock hoisting in 4 suites."
          echo "Tracked separately from Judgment OS acceptance; do not treat as Baton Field regression."
